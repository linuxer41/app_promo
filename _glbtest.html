<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>waiting</title></head>
<body>
<pre id="out">...</pre>
<script src="libs/three.min.js"></script>
<script src="libs/GLTFLoader.js"></script>
<script>
  var loader = new THREE.GLTFLoader();
  var msgs = [];
  loader.load('models/huawei_matebook_x_screen.glb', function (g) {
    var meshes = [];
    g.scene.traverse(function (o) { if (o.isMesh) meshes.push((o.material && o.material.name) + ':' + (o.geometry.attributes.position ? o.geometry.attributes.position.count : '?')); });
    document.title = 'LOADED';
    document.getElementById('out').textContent = 'MESHES ' + meshes.join(' | ');
  }, undefined, function (e) {
    document.title = 'ERROR';
    document.getElementById('out').textContent = 'ERR ' + (e && e.message ? e.message : e);
  });
</script>
</body>
</html>
